version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      android-gradle-plugin:
        patterns:
          - "com.android*"
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-camera:
        patterns:
          - "androidx.camera*"
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      kotlinx-coroutines:
        patterns:
          - "org.jetbrains.kotlinx*"
      androidx-core-and-lifecycle:
        patterns:
          - "androidx.core*"
          - "androidx.lifecycle*"
          - "androidx.activity*"
          - "androidx.navigation*"
          - "androidx.room*"
          - "androidx.datastore*"
          - "androidx.exifinterface*"
      testing:
        patterns:
          - "junit*"
          - "androidx.test*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
