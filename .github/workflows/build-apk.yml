name: Build and Release Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (requires tag_name)'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag name (e.g. v2.6.0). Required when Publish as GitHub Release is enabled.'
        required: false
        type: string
        default: ''
      overwrite_release:
        description: 'Allow updating an existing GitHub Release and overwriting matching assets'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (ktlint, Tests, Lint, Debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run ktlint, unit tests, Android lint, and debug build
        run: ./gradlew ktlintCheck :core:model:test testDebugUnitTest lintDebug compileDebugAndroidTestKotlin assembleDebug --no-daemon

      - name: Verify offline privacy contract (merged debug manifest)
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml"
          test -f "$MANIFEST"
          if grep -q 'android\.permission\.INTERNET' "$MANIFEST"; then
            echo "::error::Offline privacy violation: android.permission.INTERNET found in merged debug manifest!"
            exit 1
          fi
          echo "Offline privacy check passed: android.permission.INTERNET is absent from debug manifest."

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*
            **/build/reports/ktlint/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Build Signed Release APK
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          validate-wrappers: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compute version metadata
        id: version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          RAW_INPUT="${INPUT_TAG_NAME:-}"
          RAW_INPUT="${RAW_INPUT#"${RAW_INPUT%%[![:space:]]*}"}"
          TRIMMED_TAG="${RAW_INPUT%"${RAW_INPUT##*[![:space:]]}"}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$TRIMMED_TAG" ]; then
            RAW_TAG="$TRIMMED_TAG"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUBLISH_RELEASE:-false}" = "true" ]; then
            echo "::error::tag_name must be provided when publish_release=true via workflow_dispatch (refusing to implicitly publish fallback ciVersionName)."
            exit 1
          else
            DEFAULT_VER=$(grep -A3 'val ciVersionName' app/build.gradle.kts | sed -n 's/.*?: "\([0-9][^"]*\)".*/\1/p' | head -n 1)
            RAW_TAG="v${DEFAULT_VER:-2.5.0}"
          fi

          if [[ "$RAW_TAG" != v* ]]; then
            RELEASE_TAG="v$RAW_TAG"
          else
            RELEASE_TAG="$RAW_TAG"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$RELEASE_TAG'. Expected semantic version like v2.6.0 or v2.6.0-rc.1."
            exit 1
          fi

          VERSION_NAME="${RELEASE_TAG#v}"
          BASE_VER="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VER"
          if [ $((10#$MAJOR)) -gt 2000 ] || [ $((10#$MINOR)) -gt 99 ] || [ $((10#$PATCH)) -gt 99 ]; then
            echo "::error::Version components out of Android versionCode bounds (got $BASE_VER)."
            exit 1
          fi
          RUN_NUM=${GITHUB_RUN_NUMBER:-1}
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 10000 + 10#$PATCH * 100 + (10#$RUN_NUM % 100)))

          if [[ "$VERSION_NAME" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "IS_PRERELEASE=$IS_PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "Computed versionName=$VERSION_NAME, versionCode=$VERSION_CODE (tag=$RELEASE_TAG, prerelease=$IS_PRERELEASE)"

      - name: Guard against accidental release overwrite
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_OVERWRITE_RELEASE: ${{ inputs.overwrite_release }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "${INPUT_OVERWRITE_RELEASE:-false}" != "true" ]; then
              echo "::error::Release '$RELEASE_TAG' already exists! Refusing to overwrite published release assets. Pass overwrite_release=true only if intentionally updating."
              exit 1
            fi
            echo "Warning: release '$RELEASE_TAG' exists and overwrite_release=true was explicitly supplied."
          else
            echo "Verified '$RELEASE_TAG' does not conflict with an existing GitHub Release."
          fi

      - name: Decode and verify release keystore
        env:
          AAYNA_KEYSTORE_BASE64: ${{ secrets.AAYNA_KEYSTORE_BASE64 }}
          AAYNA_KEYSTORE_PASSWORD: ${{ secrets.AAYNA_KEYSTORE_PASSWORD }}
          AAYNA_KEY_ALIAS: ${{ secrets.AAYNA_KEY_ALIAS }}
        run: |
          if [ -z "$AAYNA_KEYSTORE_BASE64" ]; then
            echo "::error::AAYNA_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/aayna-release.p12"
          echo "$AAYNA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -storepass "$AAYNA_KEYSTORE_PASSWORD" \
            -alias "$AAYNA_KEY_ALIAS"
          echo "AAYNA_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          AAYNA_KEYSTORE_PASSWORD: ${{ secrets.AAYNA_KEYSTORE_PASSWORD }}
          AAYNA_KEY_ALIAS: ${{ secrets.AAYNA_KEY_ALIAS }}
          AAYNA_KEY_PASSWORD: ${{ secrets.AAYNA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Paayna.versionCode="${{ env.VERSION_CODE }}" \
            -Paayna.versionName="${{ env.VERSION_NAME }}" \
            --no-daemon

      - name: Verify offline privacy contract (merged release manifest)
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml"
          test -f "$MANIFEST"
          if grep -q 'android\.permission\.INTERNET' "$MANIFEST"; then
            echo "::error::Offline privacy violation: android.permission.INTERNET found in merged release manifest!"
            exit 1
          fi
          echo "Offline privacy check passed: android.permission.INTERNET is absent from release manifest."

      - name: Verify APK signature and prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK_COUNT=$(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 release APK, found $APK_COUNT!"
            exit 1
          fi
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" | head -n 1)
          echo "Found release APK: $APK_FILE"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_FILE"
          else
            keytool -printcert -jarfile "$APK_FILE"
          fi

          cp "$APK_FILE" release-assets/Aayna.apk
          cp "$APK_FILE" "release-assets/Aayna-${{ env.RELEASE_TAG }}.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

          echo "Prepared release assets:"
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Aayna-Release-APK
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Aayna ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite_release }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'true' }}
          body: |
            ### Aayna ${{ env.RELEASE_TAG }}
            - **Direct APK Download**: Tap [`Aayna.apk`](https://github.com/8Masum/aayna/releases/download/${{ env.RELEASE_TAG }}/Aayna.apk) (or [`Aayna-${{ env.RELEASE_TAG }}.apk`](https://github.com/8Masum/aayna/releases/download/${{ env.RELEASE_TAG }}/Aayna-${{ env.RELEASE_TAG }}.apk)) below to download directly to your Android device.
            - **Privacy & Security**: 100% offline (`INTERNET` permission omitted), all optical processing and storage stay on-device.
            - **Verification**: Check `SHA256SUMS.txt` to verify APK integrity.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
